{% extends 'base.html' %}
{% block title %}Iniciar sesión - Papi Pollo{% endblock %}
{% block content %}
<div class="mx-auto" style="max-width:440px">
<h2 class="h4 mb-3">Iniciar sesión</h2>
<form method="post">
    {% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger" role="alert">Usuario o contraseña incorrectos.</div>{% endif %}
    <div class="mb-3">
        <label for="id_username" class="form-label">Usuario</label>
        <input class="form-control" id="id_username" type="text" name="username" value="{{ form.username.value|default:'' }}" maxlength="150" autocomplete="username" required autofocus>
    </div>
    <div class="mb-3">
        <label for="id_password" class="form-label">Contraseña</label>
        <input class="form-control" id="id_password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-dark" type="submit">Ingresar</button>
</form>
</div>
{% endblock %}
